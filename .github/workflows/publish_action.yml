# Manual-dispatch only by design: publish is an explicit release act, never a
# merge side effect. Requires the REGISTRY_ACCESS_TOKEN repo secret (present
# since 2026-07-14; verify with `gh secret list` — the secret store is the
# ground truth, not this comment).
name: Publish to Comfy registry
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'shanevcantwell' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
