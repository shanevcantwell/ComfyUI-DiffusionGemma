name: test

# unit: the dev-env fast suite (issue #146) — proves the code is correct
# given a fully-provisioned environment (requirements.txt + dev extras).
# install-smoke: a clean-room install proof — proves requirements.txt alone
# SUPPLIES what the pack needs to cold-import, with zero dev extras and zero
# ComfyUI present (the insufficient-requirements class the dev-env suite
# structurally cannot catch, since it never installs from requirements.txt
# in isolation — see issue #146's scope-addition comment).
on:
  pull_request:
  push:
    branches:
      - main
      - "pre-*"
      - "release/*"

jobs:
  unit:
    runs-on: ubuntu-latest
    # py-modules=[] means pip install -e . installs an empty wheel (pack loads by directory); repo root must be on sys.path for tests, matching a local dev run.
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CPU-only torch: this job runs the dev-env fast suite (`pytest -m
      # 'not live and not e2e'`, addopts in pyproject.toml), which needs no
      # GPU. torch/torchvision/numpy/Pillow are CORE_PROVIDED (ComfyUI ships
      # them) and therefore intentionally absent from requirements.txt, so
      # they're installed explicitly here — CPU wheels only, no CUDA image.
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # `mcp` is its own optional-dependency group (ADR-CDG-008 Phase 2,
      # surfaces/mcp is a peer surface, not core) — separate from `dev`. It
      # is installed alongside `dev` here because three tests in the default
      # fast/mocked suite (tests/test_mcp_generate_command.py,
      # tests/test_mcp_model_command.py, tests/test_units_glossary_mint.py)
      # hard-fail at *collection* (RuntimeError from
      # surfaces/mcp/_mcp_sdk_guard.py), not merely at test time, when `mcp`
      # is absent — installing only `.[dev]` would interrupt collection for
      # the whole run instead of surfacing this suite's true pass/fail state
      # (issue #146's point). Named as a finding in the PR, not routed
      # around: those three files having no marker/skip guard for the
      # missing-SDK case is arguably its own gap.
      - name: Install runtime + dev dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .[dev,mcp]

      # --continue-on-collection-errors: as of this workflow's authoring,
      # tests/test_mcp_server_dispatch.py fails to even collect (an `mcp`
      # SDK version-drift AttributeError — `mcp>=1.0.0` resolves to `mcp`
      # 2.0.0 today, whose `Server`/`Tool` API has moved under
      # surfaces/mcp/server.py's usage; see the PR description). Without this
      # flag, one collection error blanks the whole run's signal; with it,
      # the rest of the suite still reports its true pass/fail state — which
      # is the point of this job (issue #146).
      - name: Run unit suite
        run: pytest tests/ --ignore=tests/e2e -q --continue-on-collection-errors

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stand-in for ComfyUI core's own provision: a real ComfyUI install
      # ships torch/torchvision/numpy/Pillow itself (CORE_PROVIDED,
      # tests/test_requirements_sync.py), which is exactly why they're
      # excluded from requirements.txt. This job has no ComfyUI core to
      # supply them, so it installs CPU torch explicitly to stand in for
      # that provision — everything else must come from requirements.txt
      # alone, which is the thing this job is proving.
      - name: Install CPU torch (stand-in for ComfyUI core's provision)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # requirements.txt ONLY — no dev extras, no editable install. This is
      # the clean-room condition: if requirements.txt is missing a runtime
      # dependency, the cold-import step below fails here instead of on a
      # user's fresh ComfyUI-Manager install (issue #146's operator field
      # report — the fresh-install bug this job exists to catch).
      - name: Install requirements.txt only
        run: pip install -r requirements.txt

      # Cold-import proof: `dgemma` plus every surfaces/comfyui module the
      # pack's __init__.py registers in NODE_CLASS_MAPPINGS, with zero
      # `comfy` package present. tests/test_seam.py and
      # tests/test_dual_context_import.py already prove these imports work
      # when *all* deps (including dev extras) exist; this step proves
      # requirements.txt on its own SUPPLIES what they need.
      - name: Cold-import dgemma + surfaces/comfyui (zero comfy present)
        run: |
          python -c "
          import dgemma
          from surfaces.comfyui.denoise import DGemmaDenoise
          from surfaces.comfyui.encode import DGemmaEncode
          from surfaces.comfyui.loader import DGemmaLoader
          from surfaces.comfyui.run_log_writer import DGemmaRunLogWriter
          from surfaces.comfyui.sampler import DGemmaSampler
          from surfaces.comfyui.tally_audit import DGemmaTallyAudit
          from surfaces.comfyui.token_trace import DGemmaTokenTrace
          from surfaces.comfyui.trace import DGemmaTrace
          print('OK: dgemma + all surfaces/comfyui node modules cold-import cleanly')
          "
